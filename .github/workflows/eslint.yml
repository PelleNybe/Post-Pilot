---
name: ESLint

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - apps/**
      - '!apps/docs/**'
      - libraries/**

  pull_request:
    paths:
      - package.json
      - apps/**
      - '!apps/docs/**'
      - libraries/**

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    strategy:
      matrix:
        service: ["backend", "frontend"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm exec eslint apps/${{ matrix.service }}/
          --format @microsoft/eslint-formatter-sarif
          --output-file apps/${{ matrix.service }}/eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: apps/${{ matrix.service }}/eslint-results.sarif
          wait-for-processing: true

  test-and-build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm test

      - name: Build backend, orchestrator, commands, and extension
        run: |
          pnpm run build:backend
          pnpm run build:orchestrator
          pnpm run commands:build:development
          pnpm run build:extension
