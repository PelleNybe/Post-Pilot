services:
  - type: web
    name: postpilot-backend
    env: node
    buildCommand: pnpm install && pnpm build:backend
    startCommand: pnpm start:prod:backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: postpilot-redis
          property: connectionString

  - type: web
    name: postpilot-frontend
    env: node
    buildCommand: pnpm install && pnpm build:frontend
    startCommand: pnpm start:prod:frontend
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: postpilot-backend
          property: host

databases:
  - name: postpilot-db
    plan: starter
    databaseName: postpilot
    user: postpilot_user

redis:
  - name: postpilot-redis
    plan: starter
